applications:
  - name: ((name))
    memory: ((memory))M
    disk_quota: ((disk))M
    instances: ((instances))
    buildpacks:
      - nodejs_buildpack
    health-check-type: http
    health-check-http-endpoint: /account-mgmt/health
    health-check-interval: ((healthCheckInterval))
    health-check-invocation-timeout: ((healthCheckInvocationTimeout))
    env:
      OPTIMIZE_MEMORY: true
      EASEY_DB_SERVICE: ((dbSvc))
      EASEY_ACCOUNT_API_HOST: ((host))
      EASEY_ACCOUNT_API_PORT: ((port))
      EASEY_ACCOUNT_API_PATH: ((path))
      EASEY_ACCOUNT_API_TITLE: ((title))
      EASEY_ACCOUNT_API_DESCRIPTION: ((description))
      EASEY_ACCOUNT_API_ENV: ((environment))
      EASEY_ACCOUNT_API_ENABLE_API_KEY: true
      EASEY_ACCOUNT_API_ENABLE_SECRET_TOKEN: true
      EASEY_ACCOUNT_API_ENABLE_CORS: true
      EASEY_ACCOUNT_API_ENABLE_GLOBAL_VALIDATION_PIPE: true
      EASEY_ACCOUNT_API_TRANSACTION_DATE_LIMIT_YEARS: 2
      EASEY_ACCOUNT_API_PAGINATION_MAX_PER_PAGE: 500
      EASEY_API_GATEWAY_HOST: ((apiHost))
      TZ: America/New_York
      EASEY_DB_MAX_CONNECTION_POOL: ((maxConnectionPool))
      EASEY_DB_IDLE_TIMEOUT: ((idleTimeout))
      EASEY_DB_CONNECTION_TIMEOUT: ((connectionTimeout))
      EASEY_DB_STATEMENT_TIMEOUT: ((statementTimeout))
      EASEY_DB_IDLE_TRANS_SESSION_TIMEOUT: ((idleInTransactionSessionTimeout))
      EASEY_DB_MAX_USES_BEFORE_CONN_RECREATE: ((maxUsesBeforeRecreatingConnection))
      EASEY_DB_SQL_LOGGING: ((sqlLogging))
      EASEY_DB_MAX_QUERY_EXECUTION_TIMEOUT: ((maxQueryExecutionTime))
    routes:
      - route: ((host))/((path))
    services:
      - camd-pg-db
      - log-drain
